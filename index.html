<html lang="en">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f6f2"><title>Ink — Your thoughts, connected.</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#242522;background:#f7f6f2;font-size:14px;--bg:#f7f6f2;--panel:#fbfaf7;--surface:#fff;--text:#242522;--muted:#85867f;--line:#e9e8e2;--accent:#6660a8;--soft:#efedf8;--hover:#f0efe9;--shadow:0 8px 24px #2827190c}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:var(--bg)}body.dark{--bg:#20211f;--panel:#252623;--surface:#2b2c29;--text:#eeeee8;--muted:#9d9e96;--line:#3b3c38;--accent:#aaa4ec;--soft:#39364a;--hover:#32332f;--shadow:0 8px 24px #0003;color-scheme:dark}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,[contenteditable=true]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}#app{height:100vh;display:flex}.sidebar{width:224px;flex:none;padding:23px 13px 14px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:width .2s;overflow:hidden}.sidebar.collapsed{width:62px}.brand{display:flex;align-items:center;gap:10px;margin:0 10px 28px;font:600 20px Georgia,serif;letter-spacing:-.5px}.brandmark{width:26px;height:26px;border-radius:8px;background:var(--accent);color:white;display:grid;place-items:center;font:italic 17px Georgia}.side-label{font-size:10px;letter-spacing:1.1px;color:var(--muted);font-weight:650;margin:18px 10px 7px;white-space:nowrap}.nav{display:grid;gap:3px}.nav button,.side-action{width:100%;height:34px;padding:0 10px;display:flex;gap:11px;align-items:center;border-radius:7px;text-align:left;color:#66675f;white-space:nowrap}.dark .nav button,.dark .side-action{color:var(--muted)}.nav button:hover,.side-action:hover{background:var(--hover)}.nav button.active{background:var(--soft);color:var(--accent);font-weight:600}.ico{width:17px;height:17px;display:inline-grid;place-items:center;flex:none;font-size:16px}.nav .count{margin-left:auto;color:var(--muted);font-size:11px}.sidebar .bottom{margin-top:auto}.sidebar.collapsed .brand span:not(.brandmark),.sidebar.collapsed .nav button span:not(.ico),.sidebar.collapsed .side-label,.sidebar.collapsed .side-action span:not(.ico){display:none}.sidebar.collapsed .nav button,.sidebar.collapsed .side-action{justify-content:center;padding:0}.workspace{display:flex;min-width:0;flex:1}.listpane{width:294px;flex:none;border-right:1px solid var(--line);background:var(--bg);display:flex;flex-direction:column;min-height:0}.listhead{padding:25px 18px 12px}.listtop{display:flex;align-items:center;justify-content:space-between}.listtop h1{font:600 21px Georgia,serif;margin:0;letter-spacing:-.35px}.iconbtn{width:31px;height:31px;border-radius:7px;color:var(--muted);display:inline-grid;place-items:center}.iconbtn:hover{background:var(--hover);color:var(--text)}.searchbox{margin-top:17px;height:34px;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:0 9px;display:flex;align-items:center;gap:8px;color:var(--muted)}.searchbox input{border:0;outline:0;background:transparent;min-width:0;width:100%;font-size:12px}.listtools{display:flex;justify-content:space-between;align-items:center;padding:0 18px 10px;color:var(--muted);font-size:11px}.listtools select{border:0;background:transparent;color:var(--muted);font-size:11px;outline:0}.notelist{overflow:auto;padding:0 9px 15px;flex:1}.noteitem{padding:12px 11px;margin:2px 0;border-radius:8px;cursor:pointer;border:1px solid transparent}.noteitem:hover{background:var(--panel)}.noteitem.selected{background:var(--panel);border-color:var(--line);box-shadow:var(--shadow)}.noteitem h3{font-size:13px;font-weight:600;margin:0 0 5px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.noteitem p{font-size:11px;line-height:1.5;color:var(--muted);margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.itemmeta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}.itemmeta .star{margin-left:auto;color:#c79545}.tag{display:inline-block;background:var(--soft);color:var(--accent);padding:3px 7px;border-radius:10px;font-size:10px;margin:2px 3px 0 0}.editorpane{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--panel);position:relative}.editbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);flex:none}.crumb{font-size:11px;color:var(--muted);display:flex;gap:7px;align-items:center}.save{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center}.save:before{content:"";height:6px;width:6px;background:#75a481;border-radius:99px}.editor-scroll{overflow:auto;flex:1}.paper{max-width:720px;margin:0 auto;padding:65px 60px 80px;min-height:100%}.note-title{font:500 34px/1.2 Georgia,"Times New Roman",serif;letter-spacing:-.8px;border:0;outline:0;background:transparent;width:100%;padding:0;margin:0 0 16px;color:var(--text)}.note-title::placeholder{color:#b9b8b0}.meta-row{display:flex;align-items:center;gap:8px;margin-bottom:22px;min-height:24px}.meta-row select,.folder-label{border:0;background:transparent;color:var(--muted);font-size:11px}.taginput{border:0;background:transparent;outline:none;width:110px;font-size:11px;color:var(--muted)}.toolbar{display:flex;gap:3px;align-items:center;padding:5px 0 10px;border-bottom:1px solid var(--line);margin-bottom:22px;position:sticky;top:0;background:var(--panel);z-index:2}.toolbar button{font-family:Georgia,serif;font-size:14px;height:28px;min-width:29px;padding:0 7px;border-radius:5px;color:#62635c}.toolbar button:hover{background:var(--hover)}.toolbar .sep{height:18px;width:1px;background:var(--line);margin:0 5px}.editor{min-height:300px;outline:0;font:16px/1.85 Georgia,"Times New Roman",serif;color:var(--text)}.editor:empty:before{content:"Start writing...";color:#b7b6ae;pointer-events:none}.editor h1,.editor h2,.editor h3{font-family:Georgia,serif;line-height:1.3}.editor h1{font-size:28px}.editor h2{font-size:23px}.editor h3{font-size:19px}.editor blockquote{border-left:2px solid var(--accent);margin:20px 0;padding:2px 0 2px 18px;color:var(--muted)}.editor pre{padding:14px;border-radius:7px;background:var(--hover);font:13px/1.6 ui-monospace,monospace;overflow:auto}.editor code{background:var(--hover);padding:2px 4px;border-radius:3px;font: .86em ui-monospace,monospace}.editor a{color:var(--accent)}.editor ul,.editor ol{padding-left:25px}.editor hr{border:0;border-top:1px solid var(--line);margin:26px 0}.editor .task{list-style:none}.editor input[type=checkbox]{margin-right:9px;accent-color:var(--accent)}.stats{display:flex;gap:15px;color:var(--muted);font-size:10px;margin-top:40px}.below{max-width:720px;margin:0 auto;padding:0 60px 36px}.below h4{font:600 11px sans-serif;color:var(--muted);margin:0 0 8px}.backlink{padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:5px 0;font-size:12px;cursor:pointer}.backlink:hover{background:var(--hover)}.empty{margin:auto;text-align:center;max-width:330px;padding:30px;color:var(--muted)}.empty .emptyicon{font-size:30px;margin-bottom:13px;color:var(--accent)}.empty h2{font:500 22px Georgia,serif;color:var(--text);margin:0 0 8px}.empty p{font-size:12px;line-height:1.65}.primary{background:var(--accent);color:white;padding:9px 14px;border-radius:7px;font-size:12px;font-weight:600}.primary:hover{filter:brightness(1.08)}.overlay{position:fixed;inset:0;background:#13130f72;z-index:10;display:grid;place-items:start center;padding-top:18vh}.modal{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:12px;width:min(520px,calc(100vw - 32px));padding:16px}.modal h2{font:500 20px Georgia,serif;margin:2px 0 14px}.modal input,.modal textarea,.modal select{width:100%;padding:10px;border:1px solid var(--line);background:var(--bg);border-radius:7px;margin:5px 0 12px}.modal textarea{min-height:90px}.modalrow{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.plainbtn{padding:8px 12px;border:1px solid var(--line);border-radius:7px;font-size:12px}.command-results{max-height:55vh;overflow:auto}.command{padding:10px;border-radius:6px;display:flex;justify-content:space-between;cursor:pointer}.command:hover,.command.chosen{background:var(--soft);color:var(--accent)}.command small{color:var(--muted)}.settings{padding:32px;overflow:auto}.settings h1{font:500 26px Georgia,serif}.settingrow{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid var(--line);gap:20px}.settingrow p{margin:4px 0;color:var(--muted);font-size:11px}.settingrow select,.settingrow input{padding:7px;border:1px solid var(--line);background:var(--bg);border-radius:6px}.graphwrap{flex:1;position:relative;overflow:hidden}.graphwrap canvas{width:100%;height:100%}.mobileback{display:none}
@media(max-width:850px){.sidebar{width:62px}.sidebar .brand span:not(.brandmark),.sidebar .nav button span:not(.ico),.sidebar .side-label,.sidebar .side-action span:not(.ico){display:none}.sidebar .nav button,.sidebar .side-action{justify-content:center;padding:0}.listpane{width:260px}.paper{padding:48px 34px}.below{padding:0 34px 30px}}
@media(max-width:600px){body{overflow:hidden}.sidebar{position:fixed;z-index:5;left:0;top:0;bottom:0;width:240px;transform:translateX(-100%);transition:transform .2s}.sidebar.mobile-open{transform:translateX(0)}.sidebar .brand span:not(.brandmark),.sidebar .nav button span:not(.ico),.sidebar .side-label,.sidebar .side-action span:not(.ico){display:initial}.sidebar .nav button,.sidebar .side-action{justify-content:flex-start;padding:0 10px}.workspace{width:100%}.listpane{width:100%;border:0}.editorpane{position:absolute;inset:0;z-index:3;display:none}.editorpane.mobile-active{display:flex}.editorpane.mobile-active~.listpane{display:none}.mobileback{display:inline-grid}.editbar{padding:0 12px}.paper{padding:34px 23px}.note-title{font-size:29px}.below{padding:0 23px 25px}.settings{padding:24px 18px}.settingrow{align-items:flex-start}.graphwrap{position:absolute;inset:54px 0 0}}
</style>
</head>
<body><div id="app"></div>
<script>
(()=>{'use strict';
const KEY='ink.workspace.v1', DEFAULT={version:1,notes:[],folders:[{id:'inbox',name:'Unfiled'}],tags:[],settings:{theme:'system',accent:'#6660a8',fontSize:16,lineHeight:1.85,dailyFormat:'yyyy-MM-dd',dailyTemplate:''}};
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const now=()=>new Date().toISOString();
let db, state={notes:[],folders:[],tags:[],settings:{},nav:'All Notes',selected:null,query:'',sort:'updated',compact:false,collapsed:false,distraction:false,view:'workspace',command:false,commandQuery:'',commandIndex:0,mobileEditor:false,mobileSidebar:false,save:'Saved',toast:'',filterTag:null};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'null');if(v&&v.version===1)return {...DEFAULT,...v,settings:{...DEFAULT.settings,...v.settings}}}catch(e){console.error(e)}return structuredClone(DEFAULT)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify({version:1,notes:state.notes,folders:state.folders,tags:state.tags,settings:state.settings}));state.save='Saved';renderStatus()}catch(e){state.save='Save failed';toast('Could not save locally. Browser storage may be full.') }}
function toast(msg){state.toast=msg;renderToast();setTimeout(()=>{state.toast='';renderToast()},2400)}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function plain(html=''){const d=document.createElement('div');d.innerHTML=html;return d.innerText||d.textContent||''}
function words(s){return (s.trim().match(/\S+/g)||[]).length}
function active(n){return !n.deletedAt}
function activeNotes(){return state.notes.filter(active)}
function selected(){return state.notes.find(n=>n.id===state.selected)}
function titleOf(n){return n.title?.trim()||'Untitled'}
function fmt(iso){if(!iso)return '';const d=new Date(iso);const today=new Date();if(d.toDateString()===today.toDateString())return 'Today';return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function safeDateTitle(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function sortNotes(a){const b=[...a];if(state.sort==='title')return b.sort((x,y)=>titleOf(x).localeCompare(titleOf(y)));if(state.sort==='created')return b.sort((x,y)=>y.createdAt.localeCompare(x.createdAt));return b.sort((x,y)=>y.updatedAt.localeCompare(x.updatedAt))}
function currentNotes(){let a=activeNotes();if(state.nav==='Favorites')a=a.filter(n=>n.isFavorite);if(state.nav==='Daily Notes')a=a.filter(n=>n.isDailyNote);if(state.nav==='Trash')a=state.notes.filter(n=>!!n.deletedAt);if(state.nav.startsWith('Folder:'))a=a.filter(n=>n.folderId===state.nav.slice(7));if(state.nav.startsWith('Tag:')){let id=state.nav.slice(4);a=a.filter(n=>n.tagIds.includes(id))}if(state.filterTag)a=a.filter(n=>n.tagIds.includes(state.filterTag));let q=state.query.trim().toLowerCase();if(q)a=a.filter(n=>(titleOf(n)+' '+plain(n.content)+' '+n.tagIds.map(id=>tagName(id)).join(' ')+' '+folderName(n.folderId)).toLowerCase().includes(q));return sortNotes(a)}
function folderName(id){return state.folders.find(x=>x.id===id)?.name||'Unfiled'}function tagName(id){return state.tags.find(x=>x.id===id)?.name||''}
function newNote(opts={}){const n={id:uid(),title:opts.title||'',content:opts.content||'',folderId:opts.folderId||'inbox',tagIds:[],isFavorite:false,isPinned:false,isDailyNote:!!opts.daily,dailyDate:opts.date||null,createdAt:now(),updatedAt:now(),deletedAt:null};state.notes.unshift(n);state.selected=n.id;state.nav='All Notes';state.view='workspace';persist();state.mobileEditor=true;render();return n}
function updateNote(id,patch){let n=state.notes.find(x=>x.id===id);if(!n)return;Object.assign(n,patch,{updatedAt:now()});if(n.content!==undefined){n.plainText=plain(n.content);n.wordCount=words(n.plainText)}persist()}
function selectNote(id){state.selected=id;state.view='workspace';state.mobileEditor=true;render()}
function deleteNote(id){const n=state.notes.find(x=>x.id===id);if(!n)return;if(state.nav==='Trash'){if(!confirm('Permanently delete this note? This cannot be undone.'))return;state.notes=state.notes.filter(x=>x.id!==id);if(state.selected===id)state.selected=null}else n.deletedAt=now();persist();render();toast(state.nav==='Trash'?'Note permanently deleted':'Moved to Trash')}
function restoreNote(id){const n=state.notes.find(x=>x.id===id);if(n){n.deletedAt=null;n.updatedAt=now();persist();render();toast('Note restored')}}
function escapeAttr(s=''){return esc(s).replace(/`/g,'&#96;')}
const icon={notes:'▤',star:'☆',daily:'▣',graph:'⌘',trash:'♲',settings:'⚙',search:'⌕',add:'＋',folder:'▱',tag:'#',menu:'☰',back:'‹'};
function render(){document.body.classList.toggle('dark',state.settings.theme==='dark'||(state.settings.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches));document.documentElement.style.setProperty('--accent',state.settings.accent||'#6660a8');document.documentElement.style.setProperty('--editor-size',(state.settings.fontSize||16)+'px');document.documentElement.style.setProperty('--editor-height',state.settings.lineHeight||1.85);
const hide=state.distraction;document.getElementById('app').innerHTML=`${hide?'':sidebar()}<main class="workspace">${state.view==='settings'?settingsView():state.view==='graph'?graphView():workspace()}</main>${state.command?commandModal():''}${state.toast?`<div id="toast" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;background:var(--text);color:var(--bg);padding:10px 15px;border-radius:8px;font-size:12px;box-shadow:var(--shadow)">${esc(state.toast)}</div>`:''}${modalHost()}`;bind();if(state.view==='graph')drawGraph()}
function sidebar(){return `<aside class="sidebar ${state.collapsed?'collapsed':''} ${state.mobileSidebar?'mobile-open':''}"><div class="brand"><span class="brandmark">i</span><span>ink</span><button class="iconbtn" data-act="collapse" title="Collapse sidebar" style="margin-left:auto">${state.collapsed?'›':'‹'}</button></div><button class="primary" data-act="new" style="width:100%;margin-bottom:13px;text-align:center">＋ <span>New note</span></button><div class="nav"><button data-act="open-search"><span class="ico">⌕</span><span>Search</span><span class="count">⌘K</span></button></div><div class="side-label">LIBRARY</div><div class="nav">${[['All Notes','▤',activeNotes().length],['Favorites','☆',activeNotes().filter(n=>n.isFavorite).length],['Daily Notes','▣',activeNotes().filter(n=>n.isDailyNote).length]].map(([x,ic,c])=>`<button class="${state.nav===x?'active':''}" data-nav="${x}"><span class="ico">${ic}</span><span>${x}</span><span class="count">${c||''}</span></button>`).join('')}<button class="${state.view==='graph'?'active':''}" data-view="graph"><span class="ico">⌘</span><span>Knowledge Graph</span></button></div><div class="side-label" style="display:flex;justify-content:space-between;align-items:center">FOLDERS <button class="iconbtn" data-act="add-folder" title="New folder" style="width:20px;height:20px">＋</button></div><div class="nav">${state.folders.map(f=>`<button class="${state.nav==='Folder:'+f.id?'active':''}" data-nav="Folder:${f.id}"><span class="ico">▱</span><span>${esc(f.name)}</span></button>`).join('')}</div><div class="side-label" style="display:flex;justify-content:space-between;align-items:center">TAGS <button class="iconbtn" data-act="add-tag" title="New tag" style="width:20px;height:20px">＋</button></div><div class="nav">${state.tags.map(t=>`<button class="${state.nav==='Tag:'+t.id?'active':''}" data-nav="Tag:${t.id}"><span class="ico">#</span><span>${esc(t.name)}</span></button>`).join('')}</div><div class="bottom nav"><button class="${state.nav==='Trash'?'active':''}" data-nav="Trash"><span class="ico">♲</span><span>Trash</span><span class="count">${state.notes.filter(n=>n.deletedAt).length||''}</span></button><button data-view="settings"><span class="ico">⚙</span><span>Settings</span></button></div></aside>`}
function workspace(){let list=currentNotes(), n=selected(), title=state.nav.startsWith('Folder:')?folderName(state.nav.slice(7)):state.nav.startsWith('Tag:')?tagName(state.nav.slice(4)):state.nav;return `<section class="listpane ${state.mobileEditor?'':'mobile-list'}"><header class="listhead"><div class="listtop"><h1>${esc(title)}</h1><button class="iconbtn" data-act="new" title="Create note">＋</button></div><label class="searchbox"><span>⌕</span><input id="search" placeholder="Search notes..." value="${escapeAttr(state.query)}"><kbd style="font-size:9px">/</kbd></label></header><div class="listtools"><span>${list.length} ${list.length===1?'note':'notes'}</span><select id="sort"><option value="updated" ${state.sort==='updated'?'selected':''}>Last edited</option><option value="created" ${state.sort==='created'?'selected':''}>Date created</option><option value="title" ${state.sort==='title'?'selected':''}>Title</option></select></div><div class="notelist">${list.length?list.map(noteItem).join(''):`<div class="empty"><div class="emptyicon">${state.nav==='Trash'?'♲':'✎'}</div><h2>${state.nav==='Trash'?'Trash is empty':'No notes here yet'}</h2><p>${state.query?'Try another search.':'Create a note to start collecting your thoughts.'}</p>${state.nav!=='Trash'?'<button class="primary" data-act="new">Create a note</button>':''}</div>`}</div></section>${state.nav==='Trash'?trashEditor():n?editor(n):emptyEditor()}`}
function noteItem(n){let s=state.selected===n.id,tags=n.tagIds.map(tagName).filter(Boolean).slice(0,2);return `<article class="noteitem ${s?'selected':''}" data-note="${n.id}"><h3>${n.isPinned?'⌑ ':''}${esc(titleOf(n))}</h3><p>${esc((plain(n.content)||'No additional text').slice(0,130))}</p><div class="itemmeta"><span>${fmt(n.updatedAt)}</span>${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}${n.isFavorite?'<span class="star">★</span>':''}</div></article>`}
function emptyEditor(){return `<section class="editorpane ${state.mobileEditor?'mobile-active':''}"><div class="empty"><div class="emptyicon">✳</div><h2>Your thoughts, connected.</h2><p>Create your first note and make this space yours. Everything you write stays on this device.</p><button class="primary" data-act="new">Create your first note</button></div></section>`}
function editor(n){let back=state.notes.filter(x=>active(x)&&x.id!==n.id&&findLinkedIds(x.content).includes(n.id));const tags=n.tagIds.map(tagName).filter(Boolean);return `<section class="editorpane ${state.mobileEditor?'mobile-active':''}"><div class="editbar"><div class="crumb"><button class="iconbtn mobileback" data-act="back-list">‹</button><button class="iconbtn" data-act="toggle-sidebar" title="Toggle sidebar">☰</button><span>${esc(folderName(n.folderId))}</span><span>›</span><span>${esc(titleOf(n))}</span></div><div style="display:flex;align-items:center;gap:8px"><span class="save" id="savestatus">${state.save}</span><button class="iconbtn" data-act="favorite" title="${n.isFavorite?'Remove favorite':'Favorite'}">${n.isFavorite?'★':'☆'}</button><button class="iconbtn" data-act="more" title="More actions">···</button></div></div><div class="editor-scroll"><div class="paper"><input class="note-title" id="title" placeholder="Untitled" value="${escapeAttr(n.title)}"><div class="meta-row"><span class="folder-label">▱</span><select id="folder">${state.folders.map(f=>`<option value="${f.id}" ${n.folderId===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select><span style="color:var(--line)">·</span><span style="font-size:11px;color:var(--muted)">${n.isDailyNote?'Daily note · '+esc(n.dailyDate):'Edited '+fmt(n.updatedAt)}</span>${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}<input id="taginput" class="taginput" placeholder="＋ Add tag" list="tag-options"><datalist id="tag-options">${state.tags.map(t=>`<option value="${esc(t.name)}">`).join('')}</datalist></div><div class="toolbar" aria-label="Formatting toolbar"><button data-cmd="bold" title="Bold (⌘B)"><b>B</b></button><button data-cmd="italic" title="Italic (⌘I)"><i>I</i></button><button data-cmd="underline" title="Underline"><u>U</u></button><button data-cmd="strikeThrough" title="Strikethrough"><s>S</s></button><span class="sep"></span><button data-cmd="formatBlock" data-value="h1" title="Heading 1">H1</button><button data-cmd="formatBlock" data-value="h2" title="Heading 2">H2</button><button data-cmd="formatBlock" data-value="p" title="Paragraph">¶</button><span class="sep"></span><button data-cmd="insertUnorderedList" title="Bulleted list">• List</button><button data-cmd="insertOrderedList" title="Numbered list">1. List</button><button data-act="task" title="Task list">☑</button><button data-cmd="formatBlock" data-value="blockquote" title="Quote">❝</button><button data-act="code" title="Code block">〈/〉</button><button data-act="link" title="Insert link">↗</button><button data-act="internal-link" title="Link another note">⟷</button><span class="sep"></span><button data-cmd="undo" title="Undo">↶</button><button data-cmd="redo" title="Redo">↷</button><button data-act="focus" title="Distraction-free">⛶</button></div><div id="editor" class="editor" contenteditable="true" data-note="${n.id}" spellcheck="true">${n.content||''}</div><div class="stats"><span id="wordcount">${words(plain(n.content))} words</span><span>${plain(n.content).length} characters</span><span>${Math.max(1,Math.ceil(words(plain(n.content))/220))} min read</span><span>Created ${new Date(n.createdAt).toLocaleDateString()}</span></div></div>${back.length?`<div class="below"><h4>BACKLINKS · ${back.length}</h4>${back.map(x=>`<div class="backlink" data-note="${x.id}">↗ &nbsp;${esc(titleOf(x))}<span style="color:var(--muted);float:right">${esc(plain(x.content).slice(0,60))}</span></div>`).join('')}</div>`:`<div class="below"><h4>BACKLINKS</h4><div style="font-size:11px;color:var(--muted)">No notes link here yet.</div></div>`}</div></section>`}
function trashEditor(){let n=state.notes.find(x=>x.id===state.selected&&x.deletedAt);return `<section class="editorpane ${state.mobileEditor?'mobile-active':''}">${n?`<div class="editbar"><button class="plainbtn" data-act="restore">Restore note</button><button class="plainbtn" data-act="delete">Permanently delete</button></div><div class="paper"><h1 style="font:32px Georgia">${esc(titleOf(n))}</h1><div style="color:var(--muted);font-size:12px">This note is in Trash.</div><div class="editor" style="margin-top:30px">${n.content}</div></div>`:`<div class="empty"><div class="emptyicon">♲</div><h2>Trash</h2><p>Deleted notes stay here until you permanently remove or restore them.</p>${state.notes.some(x=>x.deletedAt)?'<button class="plainbtn" data-act="empty-trash">Empty Trash</button>':''}</div>`}</section>`}
function settingsView(){return `<section class="settings"><div style="display:flex;align-items:center;gap:10px"><button class="iconbtn" data-act="settings-back">‹</button><h1>Settings</h1></div><p style="color:var(--muted);font-size:12px">Your workspace is stored locally in this browser.</p><h3 style="font:600 12px sans-serif;margin-top:30px">APPEARANCE</h3><div class="settingrow"><div><b>Theme</b><p>Choose your preferred appearance.</p></div><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div><div class="settingrow"><div><b>Accent color</b><p>Set the color used for controls and links.</p></div><input type="color" id="accent" value="${state.settings.accent||'#6660a8'}"></div><div class="settingrow"><div><b>Editor text size</b><p>Comfortable reading and writing size.</p></div><input id="fontsize" type="number" min="13" max="24" value="${state.settings.fontSize||16}" style="width:70px"></div><h3 style="font:600 12px sans-serif;margin-top:30px">DAILY NOTES</h3><div class="settingrow"><div><b>Daily note title format</b><p>Dates use your local calendar date.</p></div><select id="daily-format"><option value="yyyy-MM-dd">2026-10-26</option><option value="MMM d, yyyy">Oct 26, 2026</option><option value="MMMM d, yyyy">October 26, 2026</option></select></div><div class="settingrow"><div><b>Daily template</b><p>Inserted when creating a new daily note.</p></div><textarea id="daily-template" style="max-width:260px;min-height:55px" placeholder="## Today\n\n- ">${esc(state.settings.dailyTemplate||'')}</textarea></div><h3 style="font:600 12px sans-serif;margin-top:30px">DATA & BACKUPS</h3><div class="settingrow"><div><b>Export workspace</b><p>Download a versioned JSON backup of your notes and settings.</p></div><button class="plainbtn" data-act="export">Export JSON</button></div><div class="settingrow"><div><b>Import workspace</b><p>Merge a JSON backup into this workspace.</p></div><button class="plainbtn" data-act="import">Import JSON</button></div><div class="settingrow"><div><b>Import Markdown</b><p>Import one or more .md files as notes.</p></div><button class="plainbtn" data-act="import-md">Choose files</button></div><p style="color:var(--muted);font-size:11px;line-height:1.6;margin-top:20px">Ink does not sync to other devices. Browser-local data may be lost if you clear site data or remove your browser profile. Export a JSON backup regularly. Storage usage: approximately ${Math.round(new Blob([JSON.stringify(state.notes)]).size/1024)} KB.</p><h3 style="font:600 12px sans-serif;margin-top:28px">KEYBOARD SHORTCUTS</h3><div style="font-size:12px;color:var(--muted);line-height:2">⌘/Ctrl + N &nbsp; New note<br>⌘/Ctrl + K &nbsp; Command palette<br>⌘/Ctrl + B &nbsp; Bold<br>⌘/Ctrl + I &nbsp; Italic<br>Escape &nbsp; Close palette / exit focus</div></section>`}
function graphView(){return `<section class="graphwrap"><div class="editbar" style="position:absolute;top:0;left:0;right:0;z-index:1"><div class="crumb"><button class="iconbtn" data-act="toggle-sidebar">☰</button><span>Knowledge Graph</span></div><div class="crumb">${activeNotes().length} notes · links are parsed from [[note title]]</div></div><canvas id="graph"></canvas></section>`}
function commandModal(){let actions=[['Create a note','New note','new'],['Search notes','Type to search','search'],['Open recent notes','Recently edited','recent'],['Open Favorites','Library','favorites'],['Open Daily Notes','Today','daily'],['Open Knowledge Graph','Connections','graph'],['Toggle theme','Appearance','theme'],['Distraction-free mode','Writing','focus'],['Export data','Backup','export'],['Open Settings','Preferences','settings']];let q=state.commandQuery.toLowerCase();let filtered=actions.filter(x=>x[0].toLowerCase().includes(q));return `<div class="overlay" data-act="overlay-close"><div class="modal" data-stop="1"><input id="cmdinput" placeholder="Search commands and notes..." value="${escapeAttr(state.commandQuery)}" autofocus><div class="command-results">${filtered.map((x,i)=>`<div class="command ${i===state.commandIndex?'chosen':''}" data-command="${x[2]}">${x[0]}<small>${x[1]}</small></div>`).join('')}${q?activeNotes().filter(n=>titleOf(n).toLowerCase().includes(q)).slice(0,5).map(n=>`<div class="command" data-open-note="${n.id}">Open ${esc(titleOf(n))}<small>Note</small></div>`).join(''):''}</div></div></div>`}
function modalHost(){return `${state.modal?`<div class="overlay" data-act="overlay-close"><div class="modal" data-stop="1">${state.modal}</div></div>`:''}<input id="file-input" type="file" accept="application/json" hidden><input id="md-input" type="file" accept=".md,.markdown,text/markdown" multiple hidden>`}
function openModal(inner){state.modal=inner;render()}
function findLinkedIds(content=''){const ids=[];let re=/\[\[([^\]]+)\]\]/g,m;while((m=re.exec(plain(content)))){let target=activeNotes().find(n=>n.id===m[1])||activeNotes().find(n=>titleOf(n).toLowerCase()===m[1].trim().toLowerCase());if(target)ids.push(target.id)}return [...new Set(ids)]}
function contentWithLinks(content){return content.replace(/\[\[([^\]]+)\]\]/g,(whole,label)=>{let t=activeNotes().find(n=>n.id===label)||activeNotes().find(n=>titleOf(n).toLowerCase()===label.trim().toLowerCase());return t?`<a href="#" data-open-note="${t.id}" title="Open note">${esc(titleOf(t))}</a>`:`<span style="color:var(--accent);border-bottom:1px dashed">${esc(label)} (missing)</span>`})}
function addTagToNote(value){let n=selected();if(!n||!value.trim())return;let name=value.trim().replace(/^#/,'');let tag=state.tags.find(t=>t.name.toLowerCase()===name.toLowerCase());if(!tag){tag={id:uid(),name,normalizedName:name.toLowerCase(),createdAt:now()};state.tags.push(tag)}if(!n.tagIds.includes(tag.id))n.tagIds.push(tag.id);updateNote(n.id,{tagIds:n.tagIds});render()}
function doExport(){let archive={format:'ink-workspace',schemaVersion:1,exportedAt:now(),notes:state.notes,folders:state.folders,tags:state.tags,settings:state.settings};download(JSON.stringify(archive,null,2),'ink-backup-'+safeDateTitle(new Date())+'.json','application/json');toast('Workspace exported')}
function download(text,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importFile(file){let reader=new FileReader;reader.onload=()=>{try{let v=JSON.parse(reader.result);if(v.format!=='ink-workspace'||!Array.isArray(v.notes)||!Array.isArray(v.folders)||!Array.isArray(v.tags))throw Error('Invalid Ink archive');let ids=new Set(state.notes.map(n=>n.id));let incoming=v.notes.map(n=>({...n,id:ids.has(n.id)?uid():n.id,tagIds:Array.isArray(n.tagIds)?n.tagIds:[],folderId:state.folders.some(f=>f.id===n.folderId)?n.folderId:'inbox'}));state.notes.push(...incoming);for(let f of v.folders)if(!state.folders.some(x=>x.name.toLowerCase()===f.name.toLowerCase()))state.folders.push({...f,id:state.folders.some(x=>x.id===f.id)?uid():f.id});for(let t of v.tags)if(!state.tags.some(x=>x.name.toLowerCase()===t.name.toLowerCase()))state.tags.push({...t,id:state.tags.some(x=>x.id===t.id)?uid():t.id});persist();render();toast(`Imported ${incoming.length} notes`)}catch(e){alert('Could not import this file: '+e.message)}};reader.readAsText(file)}
function markdownToHtml(md){let s=esc(md).replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>`<pre data-language="${lang}"><code>${code}</code></pre>`);s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^> (.*)$/gm,'<blockquote>$1</blockquote>').replace(/^---$/gm,'<hr>');s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>');s=s.split(/\n{2,}/).map(x=>{if(/^<(h\d|pre|blockquote|hr|ul|ol)/.test(x))return x;if(!x)return '';if(/^(\- |\* )/.test(x))return '<ul>'+x.split('\n').map(y=>'<li>'+y.replace(/^(\- |\* )/,'')+'</li>').join('')+'</ul>';if(/^\d+\. /.test(x))return '<ol>'+x.split('\n').map(y=>'<li>'+y.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>';return '<p>'+x.replace(/\n/g,'<br>')+'</p>'}).join('');return s}
function htmlToMarkdown(html){let d=document.createElement('div');d.innerHTML=html;function cv(n){if(n.nodeType===3)return n.nodeValue;let x=[...n.childNodes].map(cv).join('');switch(n.nodeName){case'H1':return '# '+x+'\n\n';case'H2':return '## '+x+'\n\n';case'H3':return '### '+x+'\n\n';case'P':return x+'\n\n';case'B':case'STRONG':return '**'+x+'**';case'I':case'EM':return '*'+x+'*';case'CODE':return '`'+x+'`';case'PRE':return '```\n'+n.innerText+'\n```\n\n';case'BLOCKQUOTE':return x.split('\n').map(a=>'> '+a).join('\n')+'\n\n';case'LI':return '- '+x+'\n';case'UL':case'OL':return x+'\n';case'HR':return '---\n\n';case'A':return '['+x+']('+n.getAttribute('href')+')';case'BR':return '\n';default:return x}}return cv(d).trim()}
function exportMarkdown(n){download('# '+(n.title||'Untitled')+'\n\n'+htmlToMarkdown(n.content||''),((n.title||'Untitled').replace(/[\\/:*?"<>|]/g,'-'))+'.md','text/markdown');toast('Markdown exported')}
function insertAtCaret(html){let e=document.getElementById('editor');if(!e)return;e.focus();document.execCommand('insertHTML',false,html);e.dispatchEvent(new InputEvent('input',{bubbles:true}))}
function insertLink(){let opts=activeNotes().map(n=>`<option value="${escapeAttr(titleOf(n))}">`).join('');openModal(`<h2>Link a note</h2><label style="font-size:11px;color:var(--muted)">Choose an existing note or type a new title</label><input id="link-title" list="link-options" placeholder="Note title"><datalist id="link-options">${opts}</datalist><div class="modalrow"><button class="plainbtn" data-act="cancel-modal">Cancel</button><button class="primary" data-act="insert-link">Insert link</button></div>`)}
function dailyNote(date=new Date()){const key=safeDateTitle(date);let n=activeNotes().find(x=>x.isDailyNote&&x.dailyDate===key);if(n){selectNote(n.id);return}let title=key;const template=state.settings.dailyTemplate||'';newNote({title,content:markdownToHtml(template),daily:true,date:key});toast('Daily note created')}
function renderStatus(){let s=document.getElementById('savestatus');if(s)s.textContent=state.save}
function renderToast(){let t=document.getElementById('toast');if(state.toast){if(!t){render();return}t.textContent=state.toast}else if(t)t.remove()}
function bind(){document.querySelectorAll('[data-nav]').forEach(el=>{el.onclick=()=>{state.nav=el.dataset.nav;state.view='workspace';state.selected=null;state.mobileEditor=false;state.query='';render()};el.oncontextmenu=e=>{let [kind,id]=el.dataset.nav.split(':');if(kind==='Folder'){e.preventDefault();openModal(`<h2>${esc(folderName(id))}</h2><div class="command" data-act="rename-folder" data-id="${id}">Rename folder</div><div class="command" data-act="delete-folder" data-id="${id}">Delete folder</div>`)}else if(kind==='Tag'){e.preventDefault();openModal(`<h2>#${esc(tagName(id))}</h2><div class="command" data-act="rename-tag" data-id="${id}">Rename tag</div><div class="command" data-act="remove-tag" data-id="${id}">Remove tag from notes</div>`)}}});document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view;state.mobileEditor=false;state.mobileSidebar=false;render()});document.querySelectorAll('[data-note]').forEach(el=>el.onclick=e=>{if(e.target.closest('[data-open-note]'))return;selectNote(el.dataset.note)});
const q=document.getElementById('search');if(q)q.oninput=()=>{state.query=q.value;let p=q.selectionStart;render();let nq=document.getElementById('search');nq.focus();nq.setSelectionRange(p,p)};const sort=document.getElementById('sort');if(sort)sort.onchange=()=>{state.sort=sort.value;render()};const title=document.getElementById('title');if(title)title.oninput=()=>{updateNote(title.closest('.editorpane').querySelector('#editor').dataset.note,{title:title.value});state.save='Saving…';renderStatus();debouncedPersist()};const folder=document.getElementById('folder');if(folder)folder.onchange=()=>{updateNote(selected().id,{folderId:folder.value});render()};const ti=document.getElementById('taginput');if(ti)ti.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();addTagToNote(ti.value)}};
const ed=document.getElementById('editor');if(ed){ed.oninput=()=>{let n=state.notes.find(x=>x.id===ed.dataset.note);if(!n)return;n.content=ed.innerHTML;n.plainText=plain(n.content);n.wordCount=words(n.plainText);n.updatedAt=now();state.save='Saving…';renderStatus();let wc=document.getElementById('wordcount');if(wc)wc.textContent=n.wordCount+' words';debouncedPersist()};ed.onclick=e=>{let a=e.target.closest('[data-open-note]');if(a){e.preventDefault();selectNote(a.dataset.openNote)}};ed.onkeydown=e=>{if(e.key==='/'&&ed.innerText.trim()===''){e.preventDefault();openSlash()}if((e.metaKey||e.ctrlKey)&&e.key==='s'){e.preventDefault();persist();toast('Saved locally')}}}
 document.querySelectorAll('[data-cmd]').forEach(b=>b.onclick=()=>{if(b.dataset.cmd==='formatBlock')document.execCommand('formatBlock',false,b.dataset.value);else document.execCommand(b.dataset.cmd,false,null);ed?.focus()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=e=>{let a=b.dataset.act;switch(a){case'new':newNote();break;case'collapse':state.collapsed=!state.collapsed;render();break;case'toggle-sidebar':if(innerWidth<=600)state.mobileSidebar=!state.mobileSidebar;else state.collapsed=!state.collapsed;render();break;case'back-list':state.mobileEditor=false;render();break;case'favorite':updateNote(selected().id,{isFavorite:!selected().isFavorite});render();break;case'more':moreMenu();break;case'focus':state.distraction=!state.distraction;render();break;case'add-folder':openModal('<h2>New folder</h2><input id="folder-name" placeholder="Folder name"><div class="modalrow"><button class="plainbtn" data-act="cancel-modal">Cancel</button><button class="primary" data-act="create-folder">Create folder</button></div>');break;case'create-folder':{let v=document.getElementById('folder-name').value.trim();if(v&&!state.folders.some(x=>x.name.toLowerCase()===v.toLowerCase())){state.folders.push({id:uid(),name:v,createdAt:now()});persist()}state.modal=null;render();break}case'add-tag':openModal('<h2>New tag</h2><input id="new-tag-name" placeholder="Tag name"><div class="modalrow"><button class="plainbtn" data-act="cancel-modal">Cancel</button><button class="primary" data-act="create-tag">Create tag</button></div>');break;case'create-tag':{let v=document.getElementById('new-tag-name').value.trim();if(v&&!state.tags.some(x=>x.name.toLowerCase()===v.toLowerCase()))state.tags.push({id:uid(),name:v,normalizedName:v.toLowerCase()});persist();state.modal=null;render();break}case'task':insertAtCaret('<ul><li class="task"><input type="checkbox"> Task</li></ul><p></p>');break;case'code':insertAtCaret('<pre><code></code></pre><p></p>');break;case'link':document.execCommand('createLink',false,prompt('Link URL'));break;case'internal-link':insertLink();break;case'insert-link':{let v=document.getElementById('link-title').value.trim();if(v)insertAtCaret(`[[${esc(v)}]]`);state.modal=null;render();break}case'cancel-modal':state.modal=null;render();break;case'overlay-close':if(e.target===b) {state.command=false;state.modal=null;render()}break;case'export':doExport();break;case'import':document.getElementById('file-input')?.click();break;case'import-md':document.getElementById('md-input')?.click();break;case'empty-trash':if(confirm('Permanently delete all notes in Trash?')){state.notes=activeNotes();state.selected=null;persist();render()}break;case'delete':deleteNote(selected().id);break;case'restore':restoreNote(selected().id);break;case'settings-back':state.view='workspace';render();break;case'open-search':openPalette();break;case'daily':dailyNote();break;case'slash':runSlash(b.dataset.value);break;case'export-note':exportMarkdown(selected());break;case'duplicate':{let n=selected();newNote({title:titleOf(n)+' copy',content:n.content,folderId:n.folderId});break}case'pin':updateNote(selected().id,{isPinned:!selected().isPinned});render();break;case'rename-tag':{let id=b.dataset.id;state.modal=null;render();renameTag(id);break}case'remove-tag':{let id=b.dataset.id;state.modal=null;render();removeTag(id);break}case'rename-folder':{let id=b.dataset.id;state.modal=null;render();renameFolder(id);break}case'delete-folder':{let id=b.dataset.id;state.modal=null;render();deleteFolder(id);break}}});
 document.querySelectorAll('[data-command]').forEach(el=>el.onclick=()=>runCommand(el.dataset.command));document.querySelectorAll('[data-open-note]').forEach(el=>el.onclick=()=>selectNote(el.dataset.openNote));const ci=document.getElementById('cmdinput');if(ci){ci.focus();ci.oninput=()=>{state.commandQuery=ci.value;state.commandIndex=0;render()};ci.onkeydown=e=>{if(e.key==='Escape'){state.command=false;render()}if(e.key==='ArrowDown'){e.preventDefault();state.commandIndex++;render()}if(e.key==='Enter'){let x=document.querySelector('.command.chosen')||document.querySelector('.command');if(x)x.click()}}}
 const th=document.getElementById('theme');if(th){th.value=state.settings.theme||'system';th.onchange=()=>{state.settings.theme=th.value;persist();render()}}const ac=document.getElementById('accent');if(ac)ac.onchange=()=>{state.settings.accent=ac.value;persist();render()};const fs=document.getElementById('fontsize');if(fs)fs.onchange=()=>{state.settings.fontSize=+fs.value;persist();render()};const df=document.getElementById('daily-format');if(df){df.value=state.settings.dailyFormat||'yyyy-MM-dd';df.onchange=()=>{state.settings.dailyFormat=df.value;persist()}}const dt=document.getElementById('daily-template');if(dt)dt.onchange=()=>{state.settings.dailyTemplate=dt.value;persist()};const fi=document.getElementById('file-input');if(fi)fi.onchange=()=>{if(fi.files[0])importFile(fi.files[0]);fi.value=''};const mi=document.getElementById('md-input');if(mi)mi.onchange=()=>{[...mi.files].forEach(f=>{let r=new FileReader;r.onload=()=>newNote({title:f.name.replace(/\.md$/i,''),content:markdownToHtml(r.result)});r.readAsText(f)});mi.value=''}
}
let persistTimer;function debouncedPersist(){clearTimeout(persistTimer);persistTimer=setTimeout(persist,500)}
function openPalette(){state.command=true;state.commandQuery='';state.commandIndex=0;render()}function runCommand(c){state.command=false;switch(c){case'new':newNote();break;case'search':state.view='workspace';state.nav='All Notes';state.query='';render();setTimeout(()=>document.getElementById('search')?.focus(),20);break;case'recent':state.nav='All Notes';state.sort='updated';state.view='workspace';render();break;case'favorites':state.nav='Favorites';state.view='workspace';render();break;case'daily':dailyNote();break;case'graph':state.view='graph';render();break;case'theme':state.settings.theme=state.settings.theme==='dark'?'light':'dark';persist();render();break;case'focus':state.distraction=!state.distraction;render();break;case'export':doExport();break;case'settings':state.view='settings';render();break}}
function openSlash(){state.modal=`<h2>Insert block</h2>${[['Paragraph','p'],['Heading 1','h1'],['Heading 2','h2'],['Heading 3','h3'],['Bullet list','ul'],['Numbered list','ol'],['Task list','task'],['Quote','quote'],['Code block','code'],['Divider','hr'],['Link to another note','link']].map(([l,v])=>`<div class="command" data-act="slash" data-value="${v}">${l}</div>`).join('')}`;render()}
function runSlash(v){state.modal=null;render();setTimeout(()=>{if(v==='link'){insertLink();return}if(v==='task'){insertAtCaret('<ul><li class="task"><input type="checkbox"> Task</li></ul><p></p>');return}if(v==='code'){insertAtCaret('<pre><code></code></pre><p></p>');return}if(v==='hr'){insertAtCaret('<hr><p></p>');return}if(v==='quote'){document.execCommand('formatBlock',false,'blockquote');return}if(v==='ul'){document.execCommand('insertUnorderedList');return}if(v==='ol'){document.execCommand('insertOrderedList');return}document.execCommand('formatBlock',false,v)},10)}
function moreMenu(){openModal(`<h2>Note actions</h2><div class="command" data-act="duplicate">Duplicate note</div><div class="command" data-act="pin">${selected().isPinned?'Unpin':'Pin'} note</div><div class="command" data-act="export-note">Export as Markdown</div><div class="command" data-act="delete">Move to Trash</div><div class="modalrow"><button class="plainbtn" data-act="cancel-modal">Close</button></div>`)}
function renameFolder(id){let f=state.folders.find(x=>x.id===id);if(!f)return;let v=prompt('Rename folder',f.name);if(v?.trim()){f.name=v.trim();persist();render()}}
function deleteFolder(id){if(id==='inbox')return toast('Unfiled folder is required');let f=state.folders.find(x=>x.id===id);if(!f)return;let choice=confirm(`Delete “${f.name}”? OK moves its notes to Unfiled; Cancel keeps the folder.`);if(choice){state.notes.forEach(n=>{if(n.folderId===id)n.folderId='inbox'});state.folders=state.folders.filter(x=>x.id!==id);if(state.nav==='Folder:'+id)state.nav='All Notes';persist();render()}}
function renameTag(id){let t=state.tags.find(x=>x.id===id);if(!t)return;let v=prompt('Rename tag',t.name);if(v?.trim()){t.name=v.trim();t.normalizedName=v.trim().toLowerCase();persist();render()}}
function removeTag(id){if(!confirm('Remove this tag from all notes?'))return;state.notes.forEach(n=>n.tagIds=n.tagIds.filter(x=>x!==id));state.tags=state.tags.filter(x=>x.id!==id);persist();render()}
function insertTagMenu(){ }
function drawGraph(){let c=document.getElementById('graph');if(!c)return;let ctx=c.getContext('2d'),rect=c.getBoundingClientRect(),dpr=devicePixelRatio||1;c.width=rect.width*dpr;c.height=rect.height*dpr;ctx.scale(dpr,dpr);let ns=activeNotes(),w=rect.width,h=rect.height,centerX=w/2,centerY=h/2+20;if(!ns.length){ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--muted');ctx.textAlign='center';ctx.font='14px sans-serif';ctx.fillText('Create notes and link them with [[note titles]] to see your knowledge graph.',centerX,centerY);return}let nodes=ns.map((n,i)=>({n,x:centerX+Math.cos(i*2*Math.PI/ns.length)*Math.min(w,h)*.28,y:centerY+Math.sin(i*2*Math.PI/ns.length)*Math.min(w,h)*.28}));ctx.strokeStyle=getComputedStyle(document.body).getPropertyValue('--line');ctx.lineWidth=1;nodes.forEach(a=>findLinkedIds(a.n.content).forEach(id=>{let b=nodes.find(z=>z.n.id===id);if(b){ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}));nodes.forEach(a=>{ctx.beginPath();ctx.arc(a.x,a.y,6,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--accent');ctx.fill();ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--text');ctx.textAlign='center';ctx.font='12px sans-serif';ctx.fillText(titleOf(a.n).slice(0,24),a.x,a.y+22)});c.onclick=e=>{let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let n=nodes.find(a=>Math.hypot(a.x-x,a.y-y)<35);if(n)selectNote(n.n.id)}}
function bindGlobal(){document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPalette()}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='n'&&!e.shiftKey){e.preventDefault();newNote()}if(e.key==='Escape'){if(state.command){state.command=false;render()}else if(state.distraction){state.distraction=false;render()}}if(e.key==='/'&&document.activeElement!==document.getElementById('editor')&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.getElementById('search')?.focus()}});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(persistTimer);persist()}});window.addEventListener('resize',()=>{if(state.view==='graph')drawGraph()})}
state={...state,...load()};state.nav='All Notes';state.selected=activeNotes()[0]?.id||null;render();bindGlobal();
})();
</script></body></html>
